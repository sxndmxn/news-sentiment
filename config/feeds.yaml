# News Sources Configuration
# Each source includes bias classification based on AllSides and Media Bias/Fact Check

sources:
  # --- LEFT-LEANING SOURCES ---

  - slug: msnbc
    name: MSNBC
    feed_url: https://www.msnbc.com/feeds/latest
    website_url: https://www.msnbc.com
    bias_label: left
    description: Left-leaning news and opinion network

  - slug: huffpost
    name: HuffPost
    feed_url: https://www.huffpost.com/section/politics/feed
    website_url: https://www.huffpost.com
    bias_label: left
    description: Progressive news and opinion

  - slug: guardian
    name: The Guardian US
    feed_url: https://www.theguardian.com/us-news/rss
    website_url: https://www.theguardian.com/us
    bias_label: center_left
    description: UK-based news with US coverage, center-left perspective

  - slug: nytimes
    name: New York Times
    feed_url: https://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml
    website_url: https://www.nytimes.com
    bias_label: center_left
    description: Major US newspaper, leans center-left

  - slug: motherjones
    name: Mother Jones
    feed_url: https://www.motherjones.com/feed/
    website_url: https://www.motherjones.com
    bias_label: left
    description: Progressive investigative journalism

  - slug: theatlantic
    name: The Atlantic
    feed_url: https://www.theatlantic.com/feed/all/
    website_url: https://www.theatlantic.com
    bias_label: center_left
    description: Long-form journalism, center-left perspective

  - slug: vox
    name: Vox
    feed_url: https://www.vox.com/rss/index.xml
    website_url: https://www.vox.com
    bias_label: left
    description: Explanatory journalism with progressive lens

  - slug: cnn
    name: CNN
    feed_url: https://rss.cnn.com/rss/cnn_allpolitics.rss
    website_url: https://www.cnn.com
    bias_label: center_left
    description: Major cable news network, generally center-left

  - slug: slate
    name: Slate
    feed_url: https://slate.com/feeds/all.rss
    website_url: https://slate.com
    bias_label: left
    description: Politics and culture commentary, left-leaning

  # --- CENTER SOURCES ---

  - slug: reuters
    name: Reuters
    feed_url: https://news.google.com/rss/search?q=site:reuters.com&hl=en-US&gl=US&ceid=US:en
    website_url: https://www.reuters.com
    bias_label: center
    description: International wire service, fact-based reporting (via Google News)

  - slug: apnews
    name: Associated Press
    feed_url: https://news.google.com/rss/search?q=site:apnews.com&hl=en-US&gl=US&ceid=US:en
    website_url: https://apnews.com
    bias_label: center
    description: News wire service, factual reporting (via Google News)

  - slug: npr
    name: NPR News
    feed_url: https://feeds.npr.org/1001/rss.xml
    website_url: https://www.npr.org
    bias_label: center
    description: Public radio, generally balanced coverage

  - slug: bbc
    name: BBC News
    feed_url: https://feeds.bbci.co.uk/news/world/us_and_canada/rss.xml
    website_url: https://www.bbc.com/news
    bias_label: center
    description: British public broadcaster, balanced international coverage

  - slug: axios
    name: Axios
    feed_url: https://api.axios.com/feed/
    website_url: https://www.axios.com
    bias_label: center
    description: Smart brevity news format

  - slug: thehill
    name: The Hill
    feed_url: https://thehill.com/feed/
    website_url: https://thehill.com
    bias_label: center
    description: Political journalism, moderate perspective

  - slug: pbs
    name: PBS NewsHour
    feed_url: https://www.pbs.org/newshour/feeds/rss/
    website_url: https://www.pbs.org/newshour
    bias_label: center
    description: Public television news, generally balanced

  - slug: usatoday
    name: USA Today
    feed_url: https://rssfeeds.usatoday.com/usatoday-NewsTopStories
    website_url: https://www.usatoday.com
    bias_label: center
    description: National newspaper, mainstream coverage

  # --- RIGHT-LEANING SOURCES ---

  - slug: wsj
    name: Wall Street Journal
    feed_url: https://feeds.a.dj.com/rss/RSSWorldNews.xml
    website_url: https://www.wsj.com
    bias_label: center_right
    description: Business-focused, center-right editorial stance

  - slug: washingtonexaminer
    name: Washington Examiner
    feed_url: https://www.washingtonexaminer.com/rss.xml
    website_url: https://www.washingtonexaminer.com
    bias_label: center_right
    description: Conservative-leaning political news and commentary

  - slug: breitbart
    name: Breitbart
    feed_url: https://www.breitbart.com/feed/
    website_url: https://www.breitbart.com
    bias_label: right
    description: Conservative news and opinion site

  - slug: foxnews
    name: Fox News
    feed_url: https://moxie.foxnews.com/google-publisher/politics.xml
    website_url: https://www.foxnews.com
    bias_label: right
    description: Conservative news network

  - slug: nypost
    name: New York Post
    feed_url: https://nypost.com/feed/
    website_url: https://nypost.com
    bias_label: right
    description: Tabloid newspaper, conservative leaning

  - slug: dailywire
    name: Daily Wire
    feed_url: https://www.dailywire.com/feeds/rss.xml
    website_url: https://www.dailywire.com
    bias_label: right
    description: Conservative news and commentary

  - slug: nationalreview
    name: National Review
    feed_url: https://www.nationalreview.com/feed/
    website_url: https://www.nationalreview.com
    bias_label: right
    description: Conservative commentary magazine

  - slug: washingtontimes
    name: Washington Times
    feed_url: https://www.washingtontimes.com/rss/headlines/news/politics/
    website_url: https://www.washingtontimes.com
    bias_label: right
    description: Conservative newspaper based in Washington DC

# RSS Feed Health Check Settings
health_check:
  timeout_seconds: 30
  retry_attempts: 3
  retry_delay_seconds: 5

# Ingestion Settings
ingestion:
  max_articles_per_source: 50
  min_content_length: 100
  max_content_length: 100000
  fetch_interval_minutes: 60
